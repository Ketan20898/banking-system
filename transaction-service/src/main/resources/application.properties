spring.application.name=transaction-service


server.port =8082
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction-service
spring.datasource.username=postgres
spring.datasource.password=Ketan@123

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# Kafka Configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=transaction-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Optional
spring.kafka.listener.missing-topics-fatal=false

#Actuator

management.endpoints.web.exposure.include=health,info

account.service.url=http://localhost:8081

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
